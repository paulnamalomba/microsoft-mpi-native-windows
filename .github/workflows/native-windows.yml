# Native Windows build and verification of the MS-MPI fork on GitHub-hosted runners.
# Installs the pinned toolchain (native/toolchain-pins.json), builds Release and Debug,
# and runs the required checks of AGENTS.md: catalog and ABI parity with Microsoft
# MS-MPI 10.1.3, identity, probes, the deterministic launch-race test, the Debug
# runtime, and repeated launches on two CPUs. A run never accepts a build; acceptance
# records are written separately from a recorded candidate run.
name: Native Windows

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate version to stamp (default is the version after MSMPI_INTERNAL_VERSION)
        required: false
        default: ''
      stress_launches:
        description: Four-rank launches on two CPUs
        required: false
        default: '200'

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run: {shell: pwsh}
    env:
      PYTHONUTF8: '1'
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - name: Select the toolchain cache
        run: |
          "TOOLCHAIN_CACHE=$env:RUNNER_TEMP\toolchain-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: 3.13.5}
      - name: Install the pinned toolchain and the MS-MPI 10.1.3 reference
        run: |
          python -B native/ci/download_toolchain.py --cache "$env:TOOLCHAIN_CACHE"
          if ($LASTEXITCODE) { throw 'Pinned download failed' }
          foreach ($component in 'visual_studio_installer', 'visual_studio', 'ifx', 'msmpi_runtime', 'msmpi_sdk') {
            pwsh -NoProfile -File native/ci/install-toolchain.ps1 -Component $component -Cache "$env:TOOLCHAIN_CACHE"
            if ($LASTEXITCODE) { throw "Pinned install failed: $component" }
          }
      - name: Verify the pinned environment
        run: python -B native/build.py environment
      - name: Build Release
        run: |
          $candidate = if ($env:CANDIDATE) { @('--candidate', $env:CANDIDATE) } else { @() }
          python -B native/build.py baseline --configuration Release @candidate
          if ($LASTEXITCODE) { throw 'Release build failed' }
      - name: Build Debug
        run: |
          $candidate = if ($env:CANDIDATE) { @('--candidate', $env:CANDIDATE) } else { @() }
          python -B native/build.py baseline --configuration Debug @candidate
          if ($LASTEXITCODE) { throw 'Debug build failed' }
      - name: Error-message catalog parity with Microsoft msmpi.dll
        run: python -B native/check_errmsgs.py src/mpi/common/x64/Release/defmsg.h "$env:SystemRoot/System32/msmpi.dll"
      - name: ABI and hardening parity with Microsoft MS-MPI 10.1.3
        run: python -B native/check_abi.py
      - name: Identity, probes, launch-race regression and Debug runtime
        run: python -B native/verify.py
      - name: Repeated four-rank launches on two CPUs
        run: python -B native/tests/stress.py --launches "${{ inputs.stress_launches || '200' }}" --ranks 4 --cpus 2
      - name: Unit tests
        run: python -B -m unittest discover -s native/tests -p "test_*.py" -v
      - name: Package the runtime and SDK
        run: |
          $evidence = Get-ChildItem out/native-verify, out/native-stress -Recurse -Filter summary.json | ForEach-Object { '--evidence'; $_.FullName }
          python -B native/package.py --require-clean @evidence
          if ($LASTEXITCODE) { throw 'Packaging failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: msmpi-native-windows-x64
          retention-days: 14
          path: |
            out/native-package/*.zip
            out/native-package/*.zip.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: msmpi-native-windows-evidence
          retention-days: 14
          path: |
            out/native-baseline/**/summary.json
            out/native-baseline/**/*.log
            out/native-verify/**/summary.json
            out/native-stress/**/summary.json
            out/Release-x64/native-identity/identity.json
            out/Debug-x64/native-identity/identity.json
            ${{ env.TOOLCHAIN_CACHE }}/logs/**/result.json
